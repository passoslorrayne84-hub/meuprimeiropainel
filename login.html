<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Espaço Uber - Faça login na sua conta para acessar o painel premium">
  <title>Espaço Uber | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <!-- ===== FUNDO ANIMADO ===== -->
  <div class="bg-animated">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="bg-grid"></div>
  </div>

  <!-- ===== CARD DE LOGIN ===== -->
  <main class="login-container">
    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-icon">
          <i class="fas fa-layer-group"></i>
        </div>
        <h1 class="logo-title">ESPAÇO <span class="neon">UBER</span></h1>
        <p class="logo-subtitle">Painel Premium</p>
      </div>

      <!-- Subtítulo -->
      <p class="login-welcome">Bem-vindo de volta! Faça login na sua conta <strong>Fred contas</strong>.</p>

      <!-- Formulário -->
      <form id="loginForm" class="login-form" novalidate>
        <!-- Usuário -->
        <div class="input-group">
          <i class="fas fa-user input-icon"></i>
          <input
            type="text"
            id="username"
            name="username"
            class="input-field"
            placeholder="Usuário"
            autocomplete="username"
            required
          >
        </div>

        <!-- Senha -->
        <div class="input-group">
          <i class="fas fa-lock input-icon"></i>
          <input
            type="password"
            id="password"
            name="password"
            class="input-field"
            placeholder="Senha"
            autocomplete="current-password"
            required
          >
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <!-- Mockup Captcha (Cloudflare Turnstile) -->
        <div class="captcha-box" id="captchaBox">
          <div class="captcha-checkbox" id="captchaCheckbox" role="checkbox" aria-checked="false" tabindex="0">
            <i class="fas fa-check captcha-check-icon"></i>
            <i class="fas fa-spinner fa-spin captcha-loading-icon"></i>
          </div>
          <span class="captcha-text">Sou humano</span>
          <div class="captcha-brand">
            <span class="captcha-brand-text">Protected by</span>
            <span class="captcha-brand-logo">
              <i class="fas fa-shield-halved"></i> Turnstile
            </span>
          </div>
        </div>

        <!-- Mensagem de erro -->
        <div class="error-message" id="errorMessage" role="alert">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorText"></span>
        </div>

        <!-- Botão Entrar -->
        <button type="submit" class="btn-login" id="btnLogin">
          <span class="btn-text" id="btnText">Entrar</span>
          <span class="btn-loading" id="btnLoading">
            <i class="fas fa-spinner fa-spin"></i>
            <span>Autenticando...</span>
          </span>
        </button>
      </form>

      <!-- Rodapé -->
      <div class="login-footer">
        <p>Não tem uma conta? <a href="#" id="registerLink">Registre-se</a></p>
      </div>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
